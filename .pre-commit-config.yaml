repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.agents/
      - id: end-of-file-fixer
        exclude: ^\.agents/
      - id: check-yaml
      - id: check-json
        exclude: ^\.agents/
      - id: mixed-line-ending
        # Check-only (KHÔNG --fix): script sinh CSV đã newline="\n" từ gốc.
        # --fix tự sửa sau gây xung đột stash, tốn 2-3 vòng commit (noise agent).
        args: ['--fix=no']
        exclude: ^\.agents/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Check-only (KHÔNG --fix, KHÔNG format): repo Python dùng tabs,
      # auto-fix tự sửa gây xung đột stash. Muốn sửa thì chạy tay.
      - id: ruff
        files: ^apps/vanphat_portal/
  - repo: local
    hooks:
      - id: forbid-frappe-patterns
        name: forbid frappe anti-patterns
        entry: bash -c 'grep -rn "allow_guest\\s*=\\s*True\\|frappe\\.get_all\\|limit\\s*=\\s*500\\|_load_csv\\|3100000" apps/vanphat_portal/vanphat_portal/api apps/vanphat_portal/frontend/src --include="*.py" --include="*.vue" --include="*.js" | grep -v "FALLBACK\\|khong limit=500\\|Company" && echo "FORBIDDEN PATTERN FOUND" && exit 1 || exit 0'
        language: system
        pass_filenames: false
      # CONSTRAINTS.md §1: 7 luật cấm phải bằng 0. Chạy ~0,1s, không cần bench/mạng.
      - id: constraints-floor
        name: constraints floor (mock/suppression/secret/stub/v-html)
        entry: python3 scripts/constraints-check.py floor
        language: system
        files: ^(apps/vanphat_portal/|scripts/constraints-check\.py)
        pass_filenames: false
