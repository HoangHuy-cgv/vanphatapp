name: CD - Deploy to Production VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deploy Backup on VPS
        run: |
          echo "Triggering backup before deployment..."
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/vanphat && sudo docker compose -f infra/docker-compose.yml --profile backup run --rm backup || true"

      - name: Sync Code & Assets to VPS
        run: |
          echo "Packaging repository files..."
          git archive HEAD apps scripts data/clean-data infra/docker-compose.yml | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/vanphat && tar -x"

      - name: Execute Migrations & Asset Linking
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << 'EOF'
            set -euo pipefail
            cd /opt/vanphat

            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            if [ -z "$CHANGED" ]; then
              echo "Non-git sync dir — default safe: migrate + restart backend."
              sudo docker compose -f infra/docker-compose.yml exec -T backend bench --site app.vanphat.io.vn migrate
              sudo docker compose -f infra/docker-compose.yml restart backend
              echo "Waiting for backend to come back..."
              BACKEND_UP=0
              for i in $(seq 1 12); do
                if sudo docker compose -f infra/docker-compose.yml exec -T backend bench --site app.vanphat.io.vn execute frappe.ping >/dev/null 2>&1; then BACKEND_UP=1; break; fi
                sleep 5
              done
              if [ "$BACKEND_UP" != "1" ]; then echo "Backend did not recover in 60s!"; exit 1; fi
            else
              if echo "$CHANGED" | grep -qE 'apps/vanphat_portal/vanphat_portal/(api/|patches/|hooks\.py$)'; then
                echo "Backend changed — applying ERPNext DocType migrations..."
                sudo docker compose -f infra/docker-compose.yml exec -T backend bench --site app.vanphat.io.vn migrate
              else
                echo "No DocType change — skipping bench migrate."
              fi

              if echo "$CHANGED" | grep -qE 'apps/vanphat_portal/vanphat_portal/www/[^/]*\.py$'; then
                echo "www/*.py changed — restarting backend to reload gunicorn..."
                sudo docker compose -f infra/docker-compose.yml restart backend
                echo "Waiting for backend to come back..."
                BACKEND_UP=0
                for i in $(seq 1 12); do
                  if sudo docker compose -f infra/docker-compose.yml exec -T backend bench --site app.vanphat.io.vn execute frappe.ping >/dev/null 2>&1; then BACKEND_UP=1; break; fi
                  sleep 5
                done
                if [ "$BACKEND_UP" != "1" ]; then echo "Backend did not recover in 60s!"; exit 1; fi
              else
                echo "No www/*.py change — backend keeps running."
              fi
            fi

            echo "Ensuring static assets symlink..."
            sudo docker compose -f infra/docker-compose.yml exec -T frontend ln -sfn /home/frappe/frappe-bench/apps/vanphat_portal/vanphat_portal/public /home/frappe/frappe-bench/assets/vanphat_portal

            echo "Reloading nginx (no container restart)..."
            sudo docker compose -f infra/docker-compose.yml exec -T frontend nginx -s reload
          EOF

      - name: Post-deploy Smoke Tests
        run: |
          echo "Testing live portal endpoints..."
          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://app.vanphat.io.vn/login)
          echo "Login endpoint status: HTTP $LOGIN_STATUS"

          if [ "$LOGIN_STATUS" != "200" ]; then
            echo "Smoke test failed: Login endpoint returned HTTP $LOGIN_STATUS"
            exit 1
          fi

          echo "✓ Production deployment verified successfully."
