<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>Đăng nhập — Bao Bì Vạn Phát</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			min-height: 100vh;
			width: 100%;
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			background-color: #0b0f17;
			color: #f3f4f6;
		}

		.page-wrapper {
			display: flex;
			min-height: 100vh;
			width: 100%;
			align-items: center;
			justify-content: center;
			padding: 24px 16px;
			background:
				linear-gradient(180deg, rgba(11, 15, 23, 0.82) 0%, rgba(15, 23, 42, 0.88) 50%, rgba(11, 15, 23, 0.94) 100%),
				url('/assets/vanphat_portal/images/bg-factory.webp') center / cover no-repeat #0b0f17;
		}

		.auth-card {
			display: flex;
			flex-direction: column;
			align-items: center;
			width: 100%;
			max-width: 320px;
			margin: 0 auto;
		}

		.auth-header {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			margin-bottom: 24px;
			width: 100%;
		}

		.auth-logo {
			width: 110px;
			height: auto;
			max-height: 55px;
			object-fit: contain;
			margin-bottom: 12px;
			filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
		}

		.auth-title {
			font-size: 22px;
			font-weight: 800;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: #ffffff;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
			white-space: nowrap;
		}

		.auth-form {
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.input-wrapper {
			position: relative;
			display: flex;
			align-items: center;
			width: 100%;
		}

		.form-input {
			width: 100%;
			height: 46px;
			padding: 0 14px;
			font-family: inherit;
			font-size: 16px !important;
			font-weight: 500;
			color: #ffffff;
			background: rgba(15, 23, 42, 0.85);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border: 1px solid rgba(255, 255, 255, 0.22);
			border-radius: 10px;
			outline: none;
			transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
		}

		.form-input[type="password"] {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			letter-spacing: 0.05em;
		}

		.input-wrapper.has-toggle .form-input {
			padding-right: 42px;
		}

		.form-input::placeholder {
			font-size: 14px;
			font-weight: 400;
			color: #9ca3af;
		}

		.form-input:hover {
			border-color: rgba(255, 255, 255, 0.38);
			background: rgba(15, 23, 42, 0.92);
		}

		.form-input:focus {
			border-color: #3b82f6;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.28);
			background: rgba(15, 23, 42, 0.98);
		}

		/* Dark Autofill styling */
		.form-input:-webkit-autofill,
		.form-input:-webkit-autofill:hover,
		.form-input:-webkit-autofill:focus,
		.form-input:-webkit-autofill:active,
		.form-input:autofill {
			font-family: inherit !important;
			font-size: 16px !important;
			font-weight: 500 !important;
			-webkit-text-fill-color: #ffffff !important;
			-webkit-box-shadow: 0 0 0 50px #0f172a inset !important;
			box-shadow: 0 0 0 50px #0f172a inset !important;
			caret-color: #ffffff !important;
			transition: background-color 5000s ease-in-out 0s;
		}

		.toggle-pwd {
			position: absolute;
			right: 4px;
			top: 50%;
			transform: translateY(-50%);
			width: 34px;
			height: 34px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: transparent;
			border: none;
			color: #9ca3af;
			cursor: pointer;
			border-radius: 6px;
			transition: color 0.15s ease;
		}

		.toggle-pwd:hover {
			color: #ffffff;
		}

		.toggle-pwd svg {
			width: 18px;
			height: 18px;
		}

		.alert-box {
			display: none;
			padding: 10px 12px;
			border-radius: 8px;
			background: rgba(239, 68, 68, 0.14);
			border: 1px solid rgba(239, 68, 68, 0.35);
			color: #fca5a5;
			font-size: 13px;
			font-weight: 500;
			line-height: 1.35;
			text-align: center;
		}

		.alert-box.show {
			display: block;
		}

		.submit-btn {
			width: 100%;
			height: 46px;
			margin-top: 2px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			font-family: inherit;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.02em;
			color: #ffffff;
			background: #2563eb;
			border: 1px solid #3b82f6;
			border-radius: 10px;
			cursor: pointer;
			box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
			transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
		}

		.submit-btn:hover {
			background: #1d4ed8;
			border-color: #2563eb;
			box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
		}

		.submit-btn:active {
			transform: scale(0.98);
		}

		.submit-btn:disabled {
			opacity: 0.65;
			cursor: not-allowed;
			transform: none;
		}

		.spinner {
			display: none;
			width: 16px;
			height: 16px;
			border: 2px solid rgba(255, 255, 255, 0.3);
			border-top-color: #ffffff;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		.submit-btn.loading .spinner {
			display: inline-block;
		}

		.submit-btn.loading .btn-text {
			opacity: 0.85;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		@media (max-width: 480px) {
			.auth-title {
				font-size: 20px;
			}
		}
	</style>
</head>
<body>
	<main class="page-wrapper">
		<div class="auth-card">
			<header class="auth-header">
				<img
					src="/assets/vanphat_portal/images/logo-vanphat.png"
					onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='../public/images/logo-vanphat.png';}"
					alt="Bao Bì Vạn Phát"
					class="auth-logo"
				/>
				<h1 class="auth-title">Bao Bì Vạn Phát</h1>
			</header>

			<form class="auth-form" id="login-form" novalidate>
				<div class="input-wrapper">
					<input
						type="text"
						id="usr"
						name="usr"
						class="form-input"
						placeholder="Nhập ID / SĐT / email"
						autocomplete="username"
						required
						spellcheck="false"
					/>
				</div>

				<div class="input-wrapper has-toggle">
					<input
						type="password"
						id="pwd"
						name="pwd"
						class="form-input"
						placeholder="Nhập mật khẩu"
						autocomplete="current-password"
						required
					/>
					<button type="button" class="toggle-pwd" id="toggle-pwd" title="Ẩn/Hiện mật khẩu" aria-label="Ẩn/Hiện mật khẩu">
						<svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
							<circle cx="12" cy="12" r="3"></circle>
						</svg>
					</button>
				</div>

				<div class="alert-box" id="error-alert" role="alert"></div>

				<button type="submit" class="submit-btn" id="submit-btn">
					<span class="spinner" aria-hidden="true"></span>
					<span class="btn-text">Đăng nhập</span>
				</button>
			</form>
		</div>
	</main>

	<script>
		(function () {
			if (window.location.protocol === 'file:') {
				const logo = document.querySelector('.auth-logo');
				if (logo) logo.src = '../public/images/logo-vanphat.png';
				const wrapper = document.querySelector('.page-wrapper');
				if (wrapper) {
					wrapper.style.backgroundImage = "linear-gradient(180deg, rgba(11, 15, 23, 0.82) 0%, rgba(15, 23, 42, 0.88) 50%, rgba(11, 15, 23, 0.94) 100%), url('../public/images/bg-factory.webp')";
				}
			}

			const form = document.getElementById("login-form");
			const usrInput = document.getElementById("usr");
			const pwdInput = document.getElementById("pwd");
			const toggleBtn = document.getElementById("toggle-pwd");
			const alertBox = document.getElementById("error-alert");
			const submitBtn = document.getElementById("submit-btn");

			const eyeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
			const eyeOffIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

			toggleBtn.addEventListener("click", () => {
				const isPassword = pwdInput.type === "password";
				pwdInput.type = isPassword ? "text" : "password";
				toggleBtn.innerHTML = isPassword ? eyeOffIcon : eyeIcon;
			});

			function showError(msg) {
				alertBox.textContent = msg;
				alertBox.classList.add("show");
				submitBtn.disabled = false;
				submitBtn.classList.remove("loading");
			}

			function clearError() {
				alertBox.textContent = "";
				alertBox.classList.remove("show");
			}

			form.addEventListener("submit", async (e) => {
				e.preventDefault();
				clearError();

				const usr = (usrInput.value || "").trim();
				const pwd = pwdInput.value || "";

				if (!usr || !pwd) {
					showError("Vui lòng nhập ID và mật khẩu.");
					return;
				}

				submitBtn.disabled = true;
				submitBtn.classList.add("loading");

				try {
					const res = await fetch("/api/method/login", {
						method: "POST",
						headers: { "Content-Type": "application/x-www-form-urlencoded" },
						body: new URLSearchParams({ usr, pwd }),
					});

					const data = await res.json();
					if (res.ok && data.message === "Logged In") {
						const params = new URLSearchParams(window.location.search);
						const next = params.get("redirect-to");
						const ok = next && !next.includes("..") && !next.includes("\\")
							&& (next === "/portal" || next.startsWith("/portal/"));
						window.location.href = ok ? next : "/portal";
					} else {
						let errMsg = "ID hoặc mật khẩu không chính xác.";
						if (data && data._server_messages) {
							try {
								const msgs = JSON.parse(data._server_messages);
								if (msgs.length > 0) {
									const parsed = JSON.parse(msgs[0]);
									if (parsed.message) errMsg = parsed.message;
								}
							} catch (_) {}
						}
						showError(errMsg);
					}
				} catch (err) {
					showError("Không thể kết nối tới máy chủ. Vui lòng kiểm tra lại mạng.");
				}
			});
		}());
	</script>
</body>
</html>
