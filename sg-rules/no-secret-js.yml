id: no-secret-js
language: JavaScript
severity: error
message: "CONSTRAINTS secret: cam key/secret gan cung trong client"
note: "Secret doc tu env/server config, khong commit; chi tiet xem CONSTRAINTS.md Floor secret."
rule:
  any:
    - pattern: 'const $NAME = $VAL'
    - pattern: 'let $NAME = $VAL'
    - pattern: 'var $NAME = $VAL'
constraints:
  NAME:
    regex: '(?i).*(api[_-]?key|secret|password|passwd|private[_-]?key|auth[_-]?token).*'
  VAL:
    kind: string
files:
  - 'apps/vanphat_portal/frontend/src/**'
  - 'scripts/**'
