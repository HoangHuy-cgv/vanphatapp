id: no-secret-py
language: Python
severity: error
message: "CONSTRAINTS secret: cam key/secret gán cung trong source"
note: "Secret doc tu env/server config, khong commit; chi tiet xem CONSTRAINTS.md Floor secret."
rule:
  pattern: '$NAME = $VAL'
constraints:
  NAME:
    regex: '(?i).*(api[_-]?key|secret|password|passwd|private[_-]?key|auth[_-]?token).*'
  VAL:
    kind: string
files:
  - 'apps/vanphat_portal/vanphat_portal/**'
  - 'scripts/**'
ignores:
  - 'apps/vanphat_portal/tests/**'
